name: CI

on:
  push:
    branches: [master, feat/backend]
  pull_request:
    branches: [master, feat/backend]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: homeflow_test
          POSTGRES_USER: homeflow
          POSTGRES_PASSWORD: homeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homeflow -d homeflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=homeflow_test;Username=homeflow;Password=homeflow_test"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home-flow-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: home-flow-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-image:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t homeflow-api .
